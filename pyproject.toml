[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-retrieval-gate"
version = "0.1.0"
description = "A retrieval regression gate for RAG systems that attributes failures to the retriever and refuses to rule when the golden set is too small to know"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lavanya Gurrapu", email = "lavanya.g@mycvcareer.com"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
chroma = ["chromadb>=0.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
rag-gate = "rag_retrieval_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
