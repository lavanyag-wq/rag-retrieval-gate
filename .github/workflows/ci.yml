name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools experiments

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with no extras (the chroma adapter's boundary must hold without it)
        run: pip install -e ".[dev]"
      - name: Tests as their own step
        run: >
          pytest --junitxml=reports/junit.xml
          --cov=rag_retrieval_gate
          --cov-report=json:reports/coverage.json
          --cov-report=xml:reports/coverage.xml
      - name: Coverage floor
        run: |
          python - << 'PY'
          import json
          pct = json.load(open("reports/coverage.json"))["totals"]["percent_covered"]
          floor = 95.0
          print(f"line coverage {pct:.1f}% (floor {floor}%)")
          raise SystemExit(0 if pct >= floor else 1)
          PY

  receipts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (machine-readable reports for the collector)
        run: >
          pytest --junitxml=reports/junit.xml
          --cov=rag_retrieval_gate
          --cov-report=json:reports/coverage.json
      - name: Re-run every experiment from scratch
        run: make experiments
      - name: Collect metrics from the reports just produced
        run: python tools/collect_metrics.py --skip-tests --skip-experiments
      - name: Fail on any stale published number
        run: python tools/check_numbers.py
      - name: Regenerate the diagram and charts; fail on any drift from the committed SVGs
        run: |
          python tools/render_diagram.py
          python tools/render_charts.py
          git diff --exit-code docs/diagram.svg docs/chart-false-alarms.svg docs/chart-resolution.svg
      - name: Publish the awkward tables to the job summary
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          res = json.load(open("docs/experiments/resolution.json"))
          noise = json.load(open("docs/experiments/noise_floor.json"))
          print("### What this golden set cannot detect")
          print("")
          print("| set size | min one-direction flips | share of set |")
          print("| ---: | ---: | ---: |")
          for f in res["floors"]:
              print(f"| {f['n_queries']} | {f['min_detectable_worse']} | {f['floor_share_pct']}% |")
          print("")
          print("### Naive mean rule vs the gate (false positives, identical system)")
          print("")
          print("| subset size | naive rule |")
          print("| ---: | ---: |")
          for r in noise["naive"]:
              print(f"| {r['subset_size']} | {r['fp_rate_pct']}% |")
          g = noise["gate"]
          print("")
          print(f"gate under its sign-flip null: {g['fp_rate_pct']}% over {g['trials']} trials")
          PY
      - name: Upload experiment JSON and reports
        uses: actions/upload-artifact@v4
        with:
          name: experiments-and-reports
          path: |
            docs/experiments/
            docs/metrics.json
            reports/
